    /* Refined visual system */
    :root{--ink:#19233e;--muted:#7d849f;--navy:#151d38;--navy2:#242d55;--bg:#f5f5fc;--card:#fff;--line:#e7e7f2;--blue:#6554e8;--blue2:#8275ff;--mint:#dff8ef;--green:#119b78;--orange:#ffb45e;--orange-soft:#fff3e4;--red:#e35f78;--purple:#9b72e8;--shadow:0 12px 32px rgba(33,35,82,.075);--radius:20px}
    body{background:radial-gradient(ellipse at 80% -15%,#eeebff 0,transparent 38%),var(--bg)}
    .sidebar{background:linear-gradient(165deg,#1c2143 0%,#121a34 70%,#20204d 100%)}
    .brand-mark{background:linear-gradient(145deg,#ffd087,#ff8c73);box-shadow:0 7px 22px #11152d70}
    .nav button.active{background:linear-gradient(100deg,#6a5ae9,#8d71f3);box-shadow:0 9px 22px #4538b34d}
    .primary{background:linear-gradient(105deg,#6554e8,#8271f5);box-shadow:0 7px 17px rgba(101,84,232,.22)}
    .primary:hover{background:linear-gradient(105deg,#5846d9,#7462e8)}
    .card,.ward-card{border-color:#e9e8f5;box-shadow:var(--shadow)}
    .card{transition:box-shadow .2s ease,border-color .2s ease}
    .stat{background:linear-gradient(145deg,#fff,#fcfbff)}
    .stat:nth-child(1) .stat-ico{background:#eceaff;color:#6554e8}.stat:nth-child(2) .stat-ico{background:#dff8ef;color:#119b78}.stat:nth-child(3) .stat-ico{background:#fff1df;color:#bb741e}.stat:nth-child(4) .stat-ico{background:#f4eaff;color:#925ce2}
    .bar-fill,.progress-fill{background:linear-gradient(180deg,#9b8dff,#6554e8)}
    .sync-pill{background:#e5faf1;color:#14795f}
    .round-scripture{background:radial-gradient(circle at 90% 0,#3c4381 0,transparent 44%),linear-gradient(135deg,#22274d,#171d3a);border:1px solid #44467d;border-radius:18px;box-shadow:inset 0 1px #ffffff0c,0 16px 28px #1b1b431b}
    .timer{font-variant-numeric:tabular-nums;letter-spacing:-.06em}
    .score-team{transition:transform .16s,border-color .16s,box-shadow .16s}.score-team:hover{transform:translateY(-2px);border-color:#bcb5ff;box-shadow:0 8px 20px #6554e815}
    .score-hit{border-radius:11px;background:linear-gradient(110deg,#6554e8,#8271f5)}
    .score-team.found .score-hit{background:#e1f8ef;color:#13795f}
    .round-list-item{border-radius:13px}
    .round-list-item.active{background:#eeedff;border-color:#d9d5ff}
    .secondary{transition:.15s}.secondary:hover{background:#f6f4ff;border-color:#c8c1ff}
    .field:focus{border-color:#8c7dff;box-shadow:0 0 0 3px rgba(101,84,232,.12)}
    .login-hero{background:radial-gradient(circle at 80% 15%,#514b98 0,transparent 30%),linear-gradient(150deg,#23264f,#151b37 70%,#302654)}
    .login-tag{background:#ffffff13;border-color:#ffffff21}
    .login-hero h1 em{color:#ffc77d}
    .danger:hover{background:#ffeded}
    .modal{border:1px solid #efedff;border-radius:22px;box-shadow:0 30px 90px #11152d40}
    .modal-backdrop{backdrop-filter:blur(9px)}
    .manual-table td{padding:9px 8px;vertical-align:middle}.manual-table input[type=number]{min-width:78px;padding:8px}

/* v6: cronómetro de pantalla completa estable, cromático y accesible */
html{scroll-behavior:auto}
.fast-round-overlay{transition:background .28s ease,filter .28s ease;overscroll-behavior:contain;scrollbar-gutter:stable;touch-action:pan-y}
.fast-round-overlay.state-ready{background:linear-gradient(135deg,#392777 0%,#24245e 52%,#182447 100%)}

.fast-round-overlay.state-warning{background:linear-gradient(135deg,#ee9b24 0%,#be5636 48%,#692a53 100%)}
.fast-round-overlay.state-ended{background:linear-gradient(135deg,#d52c58 0%,#8f204f 47%,#4a1a49 100%)}
.fast-round-timer{transition:color .22s ease,text-shadow .22s ease;will-change:color}
.state-ready .fast-round-timer{color:#d4ccff;text-shadow:0 0 36px #a79cff50}
.state-running .fast-round-timer{color:#85ffde;text-shadow:0 0 38px #39e3c65c}

<body>

<script>
(() => {
  'use strict';
  const IS_APPS_SCRIPT = typeof google !== 'undefined' && !!google.script && !!google.script.run;
  const IS_MYSQL_API = !IS_APPS_SCRIPT && location.protocol !== 'file:';
  const STORE_KEY = 'pesquisas_estaca_state_v1';
  const AUTH_KEY = 'pesquisas_estaca_password_v1';
  const $ = (s, root=document) => root.querySelector(s);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const id = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-5);
  const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const prettyDate = value => { if(!value) return 'Sin fecha'; const p=String(value).split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : value; };
  const prettyDateTime = value => { if(!value) return '—'; const d=new Date(value); return Number.isNaN(d.getTime())?String(value):d.toLocaleString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); };
  const fmt = n => (Number(n)||0).toLocaleString('es-MX');
  const demoState = () => {
    const wards = ['Barrio 1','Barrio 2','Barrio 3','Barrio 4','Barrio 5'].map(name=>({id:id(),name,active:true}));
    return {wards,activities:[],activeActivityId:null,settings:{ceremonySeconds:20}};
  };
  let appState = null;
  let sessionToken = null;
  let currentUser = 'admin';
  let page = 'dashboard';
  let selectedRoundId = null;
  let timerInterval = null;
  let isSaving = false;
  let saveQueue = Promise.resolve();
  let saveLabel = IS_APPS_SCRIPT ? 'Conectando con Sheets' : 'Guardado en este navegador';
  let toastTimer = null;
  let ceremonyTimer = null;
  let ceremonyStartedAt = 0;
  let ceremonySnapshot = null;
  let ceremonyStep = 0;
  let cueRoundId = null;
  let cueFivePlayed = false;
  let cueEndPlayed = false;
  let audioContext = null;
  let focusRoundMode = false;
  let fastExitTimeout = null;
  let fastRoundReturnScrollY = 0;
  let viewedActivityId = null;

  function localState(){try { const raw=localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); } catch(e){} const s=demoState(); localStorage.setItem(STORE_KEY,JSON.stringify(s)); return s; }
  function serverCall(name,args=[]){ return new Promise((resolve,reject)=>{ const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e && e.message ? e.message : String(e)))); runner[name].apply(runner,args); }); }
  async function mysqlCall(path, method='GET', token=null, body=null){
    const headers={'Content-Type':'application/json'}; if(token) headers.Authorization=`Bearer ${token}`;
    const response=await fetch(path,{method,headers,body:body===null?undefined:JSON.stringify(body)});
    const data=await response.json().catch(()=>({message:'El servidor devolvió una respuesta no válida.'}));
    if(!response.ok) throw new Error(data.message||`Error del servidor (${response.status})`); return data;
  }
  const api = {
    login: async (username,password) => {
      if(IS_APPS_SCRIPT) return serverCall('loginApp',[username,password]);
      if(IS_MYSQL_API) return mysqlCall('/api/auth/login','POST',null,{username,password});
      const saved=localStorage.getItem(AUTH_KEY)||'admin'; if(username!=='admin' || password!==saved) return {ok:false,message:'Usuario o contraseña incorrectos.'}; return {ok:true,token:'local-demo-token',username};
    },
    load: async token => { if(IS_APPS_SCRIPT) return serverCall('getAppState',[token]); if(IS_MYSQL_API){const out=await mysqlCall('/api/state','GET',token);return out.state;} return localState(); },
    save: async (token,state) => { if(IS_APPS_SCRIPT) return serverCall('saveAppState',[token,state]); if(IS_MYSQL_API) return mysqlCall('/api/state','PUT',token,{state}); localStorage.setItem(STORE_KEY,JSON.stringify(state)); return {ok:true}; },
    changePassword: async (token,current,next) => {
      if(IS_APPS_SCRIPT) return serverCall('changeAdminPassword',[token,current,next]);
      if(IS_MYSQL_API) return mysqlCall('/api/auth/change-password','POST',token,{currentPassword:current,newPassword:next});
      const saved=localStorage.getItem(AUTH_KEY)||'admin'; if(current!==saved) return {ok:false,message:'La contraseña actual no coincide.'}; localStorage.setItem(AUTH_KEY,next); return {ok:true};
    },
    logout: async token => { if(IS_APPS_SCRIPT) return serverCall('logoutApp',[token]); return {ok:true}; }
  };
  const activeWards = () => (appState?.wards||[]).filter(w=>w.active!==false);
  const WARD_COLORS=['#7659f6','#13b79c','#f39a50','#e65d91','#3994f4','#a16be0','#df6550','#439c70','#279bb0','#c18b14','#5272cf','#bf5c9e'];
  const DEFAULT_LEADER_POINTS={bishop:100,seminary:100,yw:100};
  const LEADER_LABELS={bishop:'Obispo',seminary:'Maestro de Seminario',yw:'Presidenta de Mujeres Jóvenes'};
  function wardColor(ward){
    if(!ward)return WARD_COLORS[0];
    if(/^#[0-9a-f]{6}$/i.test(String(ward.color||'')))return ward.color;
    const list=appState?.wards||[];const index=Math.max(0,list.findIndex(w=>w.id===ward.id));
    ward.color=WARD_COLORS[index%WARD_COLORS.length];return ward.color;
  }
  function participantColor(participant){return wardColor(participant?.members?.[0]||participant?.ward);}
  function leaderPointValue(activity,key){return Math.max(0,Number(activity?.leaderPoints?.[key]??appState?.settings?.leaderPoints?.[key]??DEFAULT_LEADER_POINTS[key]??100)||0);}
  function leaderCount(activity,wardId){const at=activity?.attendance?.[wardId]||{};return ['bishop','seminary','yw'].filter(k=>!!at[k]).length;}
  function totalExtraPoints(activity){return (activity?.extraPoints||[]).reduce((n,x)=>n+Math.max(0,Number(x.points)||0),0);}
  function normalizeAppState(){
    if(!appState.settings||typeof appState.settings!=='object')appState.settings={};
    appState.settings.ceremonySeconds=Math.max(0,Math.min(300,Number(appState.settings.ceremonySeconds??20)));
    appState.settings.roundDuration=Math.max(1,Math.min(300,Number(appState.settings.roundDuration??10)));
    appState.settings.fastSeconds=appState.settings.roundDuration/2;
    appState.settings.stakeName=String(appState.settings.stakeName||'Estaca').trim()||'Estaca';
    appState.settings.leaderPoints={...DEFAULT_LEADER_POINTS,...(appState.settings.leaderPoints||{})};delete appState.settings.leaderPoints.ym;
    (appState.wards||[]).forEach((w,i)=>{if(!/^#[0-9a-f]{6}$/i.test(String(w.color||'')))w.color=WARD_COLORS[i%WARD_COLORS.length];if(!w.stakeName)w.stakeName=appState.settings.stakeName;});
    (appState.activities||[]).forEach(a=>{if(!a.leaderPoints)a.leaderPoints={...DEFAULT_LEADER_POINTS};delete a.leaderPoints.ym;delete a.soloParticipantWardIds;Object.values(a.attendance||{}).forEach(at=>{if(at&&typeof at==='object')delete at.ym;});if(!Array.isArray(a.extraPoints))a.extraPoints=[];});
  }

  // La sesión activa se determina por su estado, nunca por una referencia histórica seleccionada.
  const activity = () => {
    const list=appState?.activities||[];
    return list.find(a=>a.id===appState.activeActivityId&&a.status!=='Finalizada') || list.find(a=>a.status!=='Finalizada') || null;
  };
  const sessionById = sessionId => (appState?.activities||[]).find(a=>a.id===sessionId)||null;
  const getAttendance = (act,wardId) => { if(!act.attendance) act.attendance={}; if(!act.attendance[wardId]) act.attendance[wardId]={attendees:0,bishop:false,seminary:false,yw:false}; return act.attendance[wardId]; };
  const leadershipPoints = (a,wid) => { const a0=getAttendance(a,wid); return ['bishop','seminary','yw'].reduce((n,k)=>n+(a0[k]?leaderPointValue(a,k):0),0); };
  const resultFor = (round,wid) => round.results?.[wid] || {found:false,points:0,seconds:null};
  const rollCallComplete = a => !!(a && a.rollCallCompleted === true);
  const hasOpenActivity = () => (appState?.activities||[]).some(a=>a.status!=='Finalizada');
  const teamGroupKey = (ids,parentId='') => `${parentId || (ids||[])[0] || ''}::${(ids||[]).slice().sort().join('|')}`;
  function teamChildChipMarkup(ward,className){
    return `<span class="team-child-chip" data-team-child-id="${esc(ward.id)}"><span class="team-child-dot" style="background:${wardColor(ward)}"></span><span>${esc(ward.name)}</span><button type="button" class="team-child-remove" data-remove-team-child aria-label="Quitar ${esc(ward.name)} del equipo">×</button></span>`;
  }
  function teamGroupCardMarkup(wards,className,team={},index=0){
    const ids=Array.isArray(team.wardIds)?team.wardIds:[];
    const parentId=team.parentWardId&&ids.includes(team.parentWardId)?team.parentWardId:(ids[0]||'');
    const childIds=ids.filter(wid=>wid!==parentId);
    const options=`<option value="">Selecciona el barrio base</option>`+wards.map(w=>`<option value="${esc(w.id)}" ${w.id===parentId?'selected':''}>${esc(w.name)}</option>`).join('');

    function bindShell(){

    $('#general-settings-form')?.addEventListener('submit',e=>{e.preventDefault();const cfg=appState.settings||(appState.settings={});const oldStake=cfg.stakeName||'Estaca';const nextStake=$('#setting-stake-name').value.trim()||'Estaca';cfg.stakeName=nextStake;cfg.leaderPoints={bishop:Math.max(0,Number($('#setting-leader-bishop').value)||0),seminary:Math.max(0,Number($('#setting-leader-seminary').value)||0),yw:Math.max(0,Number($('#setting-leader-yw').value)||0)};cfg.roundDuration=Math.max(1,Math.min(300,Math.round(Number($('#setting-round-duration').value)||10)));cfg.fastSeconds=cfg.roundDuration/2;cfg.ceremonySeconds=Math.max(0,Math.min(300,Math.round(Number($('#setting-ceremony-seconds').value)||0)));(appState.wards||[]).forEach(w=>{if(!w.stakeName||w.stakeName===oldStake)w.stakeName=nextStake;});persist();showToast('Configuración guardada. El umbral de puntos altos se calcula siempre a la mitad del tiempo.');});

  async function persist(options={}){
    if(options.render!==false)render(); if(!sessionToken)return;
    const snapshot=JSON.parse(JSON.stringify(appState));
    if(!IS_APPS_SCRIPT&&!IS_MYSQL_API){try{localStorage.setItem(STORE_KEY,JSON.stringify(snapshot));saveLabel='Guardado en este navegador';return;}catch(e){saveLabel='No se pudo guardar';showToast('No se pudieron guardar los datos localmente.');return;}}
    isSaving=true; updateSyncLabel('Guardando…');
    saveQueue=saveQueue.catch(()=>{}).then(()=>api.save(sessionToken,snapshot)).then(()=>{saveLabel=IS_MYSQL_API?'Guardado en MySQL':'Sincronizado con Google Sheets';isSaving=false;updateSyncLabel(IS_MYSQL_API?'MySQL':'Google Sheets');return {ok:true};}).catch(err=>{isSaving=false;saveLabel='Error al sincronizar';updateSyncLabel('Error de conexión');showToast('No se pudo guardar: '+err.message);throw err;});
    try{return await saveQueue;}catch(e){return {ok:false,error:e};}
  }

iv><label class="session-roll-confirm"><input id="confirm-roll" type="checkbox" required><span>Confirmo que el pase de lista está completo y que los barrios seleccionados son los participantes.</span></label><div class="modal-actions"><button type="button" class="secondary" id="cancel-modal">Cancelar</button><button class="primary" type="submit">✓ Guardar pase de lista e iniciar sesión</button></div></form></div>`);

        bodies.push(ctx=>{const {header,text,rect,line}=ctx;header('Asistencia por barrio y sesión',`Sesiones ${so+1} a ${so+sessionBatch.length} · Barrios ${wo+1} a ${wo+wardBatch.length}`);const left=32,top=138,width=531,nameW=128,totalW=42,avgW=48,sessionW=(width-nameW-totalW-avgW)/sessionBatch.length;rect(left,top,width,28,'#ece8ff');text(left+5,top+9,7,'BARRIO','#51428e',true);text(left+nameW+3,top+9,6,'TOTAL','#51428e',true);text(left+nameW+totalW+3,top+9,6,'PROM.','#51428e',true);sessionBatch.forEach((act,j)=>text(left+nameW+totalW+avgW+j*sessionW+3,top+5,6,`${String(act.name||'Sesión').slice(0,13)}
${prettyDate(act.date)}`,'#51428e',true));const rowH=34;wardBatch.forEach((w,i)=>{const y=top+28+i*rowH;const participated=all.filter(act=>activityParticipantWardIds(act).includes(w.id));const total=participated.reduce((n,act)=>n+(Number(act.attendance?.[w.id]?.attendees)||0),0);const avg=participated.length?total/participated.length:0;if(i%2===0)rect(left,y,width,rowH,'#fafaff');rect(left+4,y+8,5,17,wardColor(w));text(left+13,y+7,7,String(w.name||'Barrio').slice(0,19),'#343452',i<3);text(left+nameW+3,y+7,7,fmt(total),'#343452',true);text(left+nameW+totalW+3,y+7,7,fmtDecimal(avg),'#343452',true);sessionBatch.forEach((act,j)=>{const x=left+nameW+totalW+avgW+j*sessionW;const present=activityParticipantWardIds(act).includes(w.id);text(x+3,y+7,7,present?fmt(Number(act.attendance?.[w.id]?.attendees)||0):'—',present?'#343452':'#a6a9b7',present);});line(left,y+rowH,width+left,y+rowH,'#e8e9f2',.4);});text(34,758,8,'PROM. = promedio de jóvenes en sesiones donde el barrio participó. Un guion indica que no participó.','#7d8499');});
      }
    }
    const perPage=20;
    for(let offset=0;offset<sessionRows.length;offset+=perPage){const batch=sessionRows.slice(offset,offset+perPage);bodies.push(ctx=>{const {header,text,rect,line}=ctx;header('Resumen de sesiones',`Sesiones ${offset+1} a ${offset+batch.length} · Historial completo`);const top=130,rowH=30;rect(32,top,531,25,'#ece8ff');text(39,top+7,7,'FECHA / SESION','#51428e',true);text(247,top+7,7,'JOV.','#51428e',true);text(284,top+7,7,'PREP.','#51428e',true);text(320,top+7,7,'ESCR. CON HALLAZGO','#51428e',true);text(390,top+7,7,'ESTADO','#51428e',true);text(453,top+7,7,'GANADOR / PTS','#51428e',true);batch.forEach((row,i)=>{const y=top+25+i*rowH;if(i%2===0)rect(32,y,531,rowH,'#fafaff');text(39,y+6,7,`${prettyDate(row.a.date)} · ${String(row.a.name||'Sesion').slice(0,23)}`,'#30324f',i<3);text(247,y+6,8,fmt(row.attendance),'#30324f');text(284,y+6,8,fmt((row.a.rounds||[]).length),'#30324f');text(320,y+6,8,fmt(row.found),'#30324f');text(390,y+6,7,row.a.status==='Finalizada'?'Finalizada':'En curso',row.a.status==='Finalizada'?'#13846c':'#bb7727',true);text(453,y+6,7,row.top?`${String(row.top.ward.name).slice(0,13)} ${fmt(row.top.score)} pts`:'Sin resultados','#51428e',true);line(32,y+rowH,563,y+rowH,'#e8e9f2',.4);});});}
    const historyExtras=all.flatMap(a=>(a.extraPoints||[]).map(x=>({...x,activityName:a.name,activityDate:a.date})));if(historyExtras.length){const extraByWard=(appState.wards||[]).map(w=>({label:`${w.name} (${w.stakeName||appState.settings.stakeName})`,value:historyExtras.filter(x=>x.wardId===w.id).reduce((n,x)=>n+(Number(x.points)||0),0),display:`+${fmt(historyExtras.filter(x=>x.wardId===w.id).reduce((n,x)=>n+(Number(x.points)||0),0))} pts`,sub:`${historyExtras.filter(x=>x.wardId===w.id).length} bonificaciones`,color:wardColor(w)})).filter(x=>x.value>0).sort((x,y)=>y.value-x.value);bodies.push(ctx=>{const {header,text,rect}=ctx;header('Bonificaciones históricas',`${fmt(historyExtras.reduce((n,x)=>n+(Number(x.points)||0),0))} puntos extra en ${historyExtras.length} registros`);text(34,124,14,'Puntos extra por barrio','#29204e',true);text(34,145,8,'Suma histórica de las bonificaciones manuales.','#7d8499');drawBarRows(ctx,extraByWard.slice(0,16),{top:178,rowH:36,barX:220,barW:250,valueX:485});text(34,760,8,'Los motivos individuales permanecen en los reportes de cada sesión.','#7d8499');});}
    visualPdfDownload('Informe histórico de Pesquisas','Todas las sesiones · '+all.length+' registradas',bodies,`pesquisas-historico-${today()}.pdf`);
  }
  function exportJson(){const blob=new Blob([JSON.stringify(appState,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`pesquisas-respaldo-${today()}.json`;a.click();URL.revokeObjectURL(url);showToast('Copia de respaldo descargada.');}
  async function logout(){try{await api.logout(sessionToken);}catch(e){}sessionToken=null;appState=null;selectedRoundId=null;if(timerInterval)clearInterval(timerInterval);page='dashboard';render();}

  // Install event delegation for the small number of action buttons rendered later.
  document.addEventListener('click', e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='select-round')return; if(!el.closest('#page-content'))return; const actionsHandled=new Set(['new-activity','new-round','manage-participants','edit-round-time','add-round-time','start-round','close-round','reopen-round','mark-found','new-ward','manage-wards','open-activity','export-json','logout','finish-activity','show-podium','manual-score','add-extra-points','delete-extra-points','delete-activity','move-round-up','move-round-down','edit-roll-call','fast-round','export-current-pdf','export-session-pdf','export-all-pdf']); if(actionsHandled.has(el.dataset.action)){ e.preventDefault();handleAction(el.dataset.action,el); }});

  document.addEventListener('keydown',e=>{const card=e.target.closest?.('.score-team-clickable');if(card&&e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();markFound(card.dataset.ward);return;}if(page!=='live'||e.ctrlKey||e.altKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(!/^[1-9]$/.test(e.key))return;const a=activity(),r=activeRound(a);if(!r||a.status==='Finalizada'||r.status!=='activa')return;const p=scoreParticipants(a)[Number(e.key)-1];if(p){e.preventDefault();markFound(p.key);}});

  // Keep the local prototype immediately usable, with editable sample ward names.
  renderLogin();
