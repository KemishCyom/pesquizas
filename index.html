    /* Refined visual system */
    :root{--ink:#19233e;--muted:#7d849f;--navy:#151d38;--navy2:#242d55;--bg:#f5f5fc;--card:#fff;--line:#e7e7f2;--blue:#6554e8;--blue2:#8275ff;--mint:#dff8ef;--green:#119b78;--orange:#ffb45e;--orange-soft:#fff3e4;--red:#e35f78;--purple:#9b72e8;--shadow:0 12px 32px rgba(33,35,82,.075);--radius:20px}
    body{background:radial-gradient(ellipse at 80% -15%,#eeebff 0,transparent 38%),var(--bg)}
    .sidebar{background:linear-gradient(165deg,#1c2143 0%,#121a34 70%,#20204d 100%)}
    .brand-mark{background:linear-gradient(145deg,#ffd087,#ff8c73);box-shadow:0 7px 22px #11152d70}
    .nav button.active{background:linear-gradient(100deg,#6a5ae9,#8d71f3);box-shadow:0 9px 22px #4538b34d}
    .primary{background:linear-gradient(105deg,#6554e8,#8271f5);box-shadow:0 7px 17px rgba(101,84,232,.22)}
    .primary:hover{background:linear-gradient(105deg,#5846d9,#7462e8)}
    .card,.ward-card{border-color:#e9e8f5;box-shadow:var(--shadow)}
    .card{transition:box-shadow .2s ease,border-color .2s ease}
    .stat{background:linear-gradient(145deg,#fff,#fcfbff)}
    .stat:nth-child(1) .stat-ico{background:#eceaff;color:#6554e8}.stat:nth-child(2) .stat-ico{background:#dff8ef;color:#119b78}.stat:nth-child(3) .stat-ico{background:#fff1df;color:#bb741e}.stat:nth-child(4) .stat-ico{background:#f4eaff;color:#925ce2}
    .bar-fill,.progress-fill{background:linear-gradient(180deg,#9b8dff,#6554e8)}
    .sync-pill{background:#e5faf1;color:#14795f}
    .round-scripture{background:radial-gradient(circle at 90% 0,#3c4381 0,transparent 44%),linear-gradient(135deg,#22274d,#171d3a);border:1px solid #44467d;border-radius:18px;box-shadow:inset 0 1px #ffffff0c,0 16px 28px #1b1b431b}
    .timer{font-variant-numeric:tabular-nums;letter-spacing:-.06em}
    .score-team{transition:transform .16s,border-color .16s,box-shadow .16s}.score-team:hover{transform:translateY(-2px);border-color:#bcb5ff;box-shadow:0 8px 20px #6554e815}
    .score-hit{border-radius:11px;background:linear-gradient(110deg,#6554e8,#8271f5)}
    .score-team.found .score-hit{background:#e1f8ef;color:#13795f}
    .round-list-item{border-radius:13px}

  const fmt = n => (Number(n)||0).toLocaleString('es-MX');
  const demoState = () => {
    const wards = ['Barrio 1','Barrio 2','Barrio 3','Barrio 4','Barrio 5'].map(name=>({id:id(),name,active:true}));
    const activity = {id:id(),name:'Actividad de Pesquisas',date:today(),status:'En curso',createdAt:new Date().toISOString(),startedAt:new Date().toISOString(),attendance:{},rounds:[]};
    wards.forEach(w=>activity.attendance[w.id]={attendees:0,bishop:false,seminary:false,ym:false,yw:false});

  };

  let sessionToken = null;

  async function mysqlCall(path, method='GET', token=null, body=null){

  const activity = () => appState?.activities?.find(a=>a.id===appState.activeActivityId) || appState?.activities?.[0] || null;
  const getAttendance = (act,wardId) => { if(!act.attendance) act.attendance={}; if(!act.attendance[wardId]) act.attendance[wardId]={attendees:0,bishop:false,seminary:false,ym:false,yw:false}; return act.attendance[wardId]; };
  const leadershipPoints = (a,wid) => { const a0=getAttendance(a,wid); return ['bishop','seminary','ym','yw'].reduce((n,k)=>n+(a0[k]?100:0),0); };
  const resultFor = (round,wid) => round.results?.[wid] || {found:false,points:0,seconds:null};
  const scoreFor = (a,wid) => leadershipPoints(a,wid) + (a.rounds||[]).reduce((n,r)=>n+(Number(resultFor(r,wid).points)||0),0);
  const foundFor = (a,wid) => (a.rounds||[]).filter(r=>resultFor(r,wid).found).length;
  const totals = a => activeWards().map(w=>({ward:w,score:scoreFor(a,w.id),found:foundFor(a,w.id),attendance:Number(getAttendance(a,w.id).attendees)||0,leaders:leadershipPoints(a,w.id)})).sort((a,b)=>b.score-a.score||b.found-a.found||a.ward.name.localeCompare(b.ward.name,'es'));
  const totalFound = a => (a?.rounds||[]).reduce((n,r)=>n+Object.values(r.results||{}).filter(x=>x.found).length,0);
  const totalAttendees = a => activeWards().reduce((n,w)=>n+(Number(getAttendance(a,w.id).attendees)||0),0);
  const activeRound = a => (a?.rounds||[]).find(r=>r.id===selectedRoundId) || (a?.rounds||[]).slice().reverse().find(r=>r.status!=='cerrada') || (a?.rounds||[]).slice(-1)[0] || null;

s la primera instalación.':'Vista de prueba local. Credenciales iniciales: <strong>admin / admin</strong>. Los cambios se guardan solo en este navegador.'}</div></form></section></div>`;

  function renderPage(p){switch(p){case'dashboard':return renderDashboard();case'live':return renderLive();case'attendance':return renderAttendance();case'history':return renderHistory();case'projection':return renderProjection();case'settings':return renderSettings();default:return renderDashboard();}}
  function renderDashboard(){

    return `<div class="page-head"><div><div class="eyebrow">PANEL DE CONTROL</div><h1>Resumen de la actividad</h1><p>Todo lo importante de ${esc(a.name)}. Puntos, escrituras y asistencia en un solo vistazo.</p></div><div class="head-actions"><button class="secondary" data-action="new-activity">＋ Nueva sesión</button>${a.status==='Finalizada'?`<button class="primary" data-page="live">Ver resultados</button><button class="secondary" data-action="show-podium">Ver premiación</button>`:`<button class="primary" data-page="live">＋ Registrar ronda</button><button class="danger" data-action="finish-activity">✓ Terminar sesión</button>`}</div></div>

      <div class="grid overview-grid"><div class="card"><div class="section-head"><div><h2>Puntuación por barrio</h2><p>Incluye asistencia de líderes y rondas de escrituras</p></div><button class="link-btn" data-page="projection">Ver clasificación →</button></div>${wardCount?`<div class="chart-area">${rank.map(x=>`<div class="chart-col"><div class="chart-num">${fmt(x.score)}</div><div class="bar-track"><div class="bar-fill" style="height:${Math.max(x.score?4:0,x.score/maxScore*100)}%"></div></div><div class="chart-label" title="${esc(x.ward.name)}">${esc(x.ward.name)}</div></div>`).join('')}</div><div class="small muted" style="margin-top:13px">Los puntos de asistencia de líderes cuentan dentro del total.</div>`:`<div class="empty"><strong>No hay barrios configurados.</strong>Agrega los barrios para comenzar a registrar resultados.</div>`}</div>

  function renderLive(){
    const a=activity(); const rounds=a.rounds||[]; let r=activeRound(a); if(r && !selectedRoundId) selectedRoundId=r.id; r=activeRound(a);
    const elapsed=r?.startedAt?Math.max(0,(Date.now()-Number(r.startedAt))/1000):0; const left=r?Math.max(0,Number(r.duration||10)-elapsed):10; const running=!!r && r.status==='activa' && left>0;

      ${a.status==='Finalizada'?`<div class="finish-banner"><div><strong>Esta sesión está finalizada.</strong><div class="microcopy">Puedes consultar los resultados o eliminarla desde el historial.</div></div><button class="secondary" data-action="show-podium">Ver premiación otra vez</button></div>`:''}<div class="round-layout"><div class="card round-card">${r?`<div class="section-head"><div><h2>Escritura seleccionada</h2><p>Escritura ${rounds.findIndex(x=>x.id===r.id)+1} de ${rounds.length}</p></div><span class="badge ${r.type==='especial'?'orange':'blue'}">${r.type==='especial'?'✦ Especial · '+fmt(r.specialPoints)+' pts':'Normal · '+r.earlyPoints+'/'+r.normalPoints+' pts'}</span></div><div class="round-scripture"><div class="eyebrow">ESCRITURA POR ENCONTRAR</div><h2>${esc(r.scripture)}</h2><p>${r.type==='especial'?`Escritura especial · ${fmt(r.specialPoints)} puntos por barrio que la encuentre`:`${fmt(r.earlyPoints)} pts en los primeros ${r.fastSeconds} s · ${fmt(r.normalPoints)} pts después y antes de ${r.duration} s`}</p></div><div class="timer-row"><div><div class="timer" id="timer-display">${left.toFixed(1)} <small>s</small></div><div class="timer-sub" id="timer-status">${r.status==='cerrada'?'Ronda cerrada':running?'Cronómetro en marcha':r.startedAt?'Cronómetro detenido':'Lista para iniciar'}</div></div><div class="timer-actions">${a.status==='Finalizada'?`<span class="badge green">Sesión finalizada</span>`:r.status==='cerrada'?`<button class="secondary" data-action="reopen-round">Reabrir ronda</button>`:`<button class="primary" data-action="start-round" ${running?'disabled':''}>${r.startedAt?'Reiniciar cronómetro':`Iniciar ${Number(r.duration||10)} segundos`}</button><button class="secondary" data-action="close-round" ${!r.startedAt||r.status==='cerrada'?'disabled':''}>Cerrar ronda</button>`}</div></div><div class="section-head" style="margin-top:24px;margin-bottom:8px"><div><h2>Registrar quién la encontró</h2><p>Haz clic en la tarjeta completa o en “Registrar”. Los puntos se asignan automáticamente según el tiempo.</p></div><span class="badge green">${resultRows.filter(x=>x.x.found).length}/${resultRows.length} barrios</span></div><div class="ward-score-grid">${resultRows.map(({w,x},i)=>{const canRegister=!x.found&&a.status!=='Finalizada'&&!!r.startedAt&&r.status!=='cerrada'&&left>0;return `<div class="score-team ${x.found?'found':''} ${canRegister?'score-team-clickable':''}" ${canRegister?`data-action="mark-found" data-ward="${esc(w.id)}" role="button" tabindex="0" aria-label="Registrar que ${esc(w.name)} encontró la escritura"`:'aria-disabled="true"'}><div class="score-team-mark">${x.found?'✓':String(i+1).padStart(2,'0')}</div><div class="score-team-main" style="min-width:0"><div class="score-team-name" title="${esc(w.name)}">${esc(w.name)}</div><div class="score-team-points">${x.found?`+${fmt(x.points)} pts · ${x.seconds===null||x.seconds===undefined?'Manual':Number(x.seconds).toFixed(1)+' s'}`:canRegister?'Lista para registrar':'Sin registrar'}</div></div><button type="button" class="score-hit" data-action="mark-found" data-ward="${esc(w.id)}" ${!canRegister?'disabled':''}>${x.found?'✓ Encontrada':canRegister?'Registrar':'Inicia cronómetro'}</button></div>`;}).join('')||`<div class="empty"><strong>No hay barrios activos.</strong>Agrega barrios para registrar quién encontró la escritura.</div>`}</div><div class="notice" style="margin-bottom:0;margin-top:18px">Atajos de teclado: <strong>1–9</strong> según el orden de los barrios mientras corre el cronómetro. Si se te pasa alguno, la captura manual se habilita cuando la escritura ya se inició y permite agregar o corregir resultados.</div>`:`<div class="empty"><strong>No hay escrituras configuradas.</strong>Agrega las escrituras antes de comenzar; aparecerán en orden en la lista de la derecha.<br><br><button class="primary" data-action="new-round">＋ Crear primera escritura</button></div>`}</div>

  function renderAttendance(){
    const a=activity(); const wards=activeWards();
    const allActivities=(appState.activities||[]).slice().sort((x,y)=>String(x.date||'').localeCompare(String(y.date||''))||String(x.createdAt||'').localeCompare(String(y.createdAt||'')));

    const maxActivityAttendance=Math.max(1,...activityHistory.map(x=>x.total));
    const wardHistory=(appState.wards||[]).map(w=>({ward:w,total:allActivities.reduce((n,act)=>n+(Number(act.attendance?.[w.id]?.attendees)||0),0),sessions:allActivities.filter(act=>(Number(act.attendance?.[w.id]?.attendees)||0)>0).length})).sort((x,y)=>y.total-x.total||x.ward.name.localeCompare(y.ward.name,'es'));

    const currentByWard=wards.map(w=>({ward:w,total:Number(getAttendance(a,w.id).attendees)||0})).sort((x,y)=>y.total-x.total||x.ward.name.localeCompare(y.ward.name,'es'));
    const maxCurrent=Math.max(1,...currentByWard.map(x=>x.total));
    const historicalTotal=activityHistory.reduce((n,x)=>n+x.total,0);
    const averageAttendance=allActivities.length?Math.round(historicalTotal/allActivities.length):0;
    return `<div class="page-head"><div><div class="eyebrow">PARTICIPACIÓN Y SEGUIMIENTO</div><h1>Barrios y asistencia</h1><p>Consulta las tendencias de asistencia de todas las sesiones y edita cuántos jóvenes asistieron por barrio en la sesión seleccionada.</p></div><div class="head-actions"><button class="secondary" data-action="manage-wards">Gestionar barrios</button><button class="primary" data-action="new-ward">＋ Agregar barrio</button></div></div>

  function bindShell(){
    document.querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{page=el.dataset.page; if(page==='live'&&!selectedRoundId)selectedRoundId=activeRound(activity())?.id||null; render(); if(page==='live')refreshTimerDisplay();}));
    const sw=$('#activity-switch'); if(sw)sw.addEventListener('change',()=>{appState.activeActivityId=sw.value;selectedRoundId=null; persist();});
    $('#logout-btn')?.addEventListener('click',logout);
    document.querySelectorAll('.attendance-input').forEach(el=>el.addEventListener('change',()=>{const at=getAttendance(activity(),el.dataset.ward);at.attendees=Math.max(0,Math.min(999,Number(el.value)||0));persist();}));
    document.querySelectorAll('.leader-check').forEach(el=>el.addEventListener('change',()=>{getAttendance(activity(),el.dataset.ward)[el.dataset.key]=el.checked;persist();}));
    $('#activity-settings-form')?.addEventListener('submit',e=>{e.preventDefault();const a=activity();a.name=$('#setting-activity-name').value.trim()||'Actividad de Pesquisas';a.date=$('#setting-activity-date').value||today();const requestedStatus=$('#setting-activity-status').value;if(requestedStatus==='Finalizada'&&a.status!=='Finalizada'){showToast('Usa el botón “Terminar sesión” para finalizar y mostrar la premiación.');$('#setting-activity-status').value=a.status||'En curso';return;}a.status=requestedStatus;persist();showToast('Se guardaron los datos de la actividad.');});
    $('#password-form')?.addEventListener('submit',async e=>{e.preventDefault();const current=$('#current-password').value,next=$('#new-password').value,confirm=$('#confirm-password').value,msg=$('#password-message');if(next.length<8){msg.textContent='La contraseña debe tener al menos 8 caracteres.';return;}if(next!==confirm){msg.textContent='Las contraseñas nuevas no coinciden.';return;}try{const res=await api.changePassword(sessionToken,current,next);if(!res?.ok){msg.textContent=res?.message||'No se pudo actualizar la contraseña.';return;}msg.textContent='Contraseña actualizada correctamente.';$('#password-form').reset();showToast('Contraseña actualizada.');}catch(err){msg.textContent=err.message;}});
    document.querySelectorAll('[data-action="select-round"]').forEach(el=>el.addEventListener('click',e=>{if(e.target.closest('[data-action="move-round-up"],[data-action="move-round-down"]'))return;selectedRoundId=el.dataset.round;render();refreshTimerDisplay();}));
    if(page==='live')startVisualTimer();

  async function persist(){
    render(); if(!sessionToken)return;
    const snapshot=JSON.parse(JSON.stringify(appState));
    if(!IS_APPS_SCRIPT&&!IS_MYSQL_API){try{localStorage.setItem(STORE_KEY,JSON.stringify(snapshot));saveLabel='Guardado en este navegador';return;}catch(e){saveLabel='No se pudo guardar';showToast('No se pudieron guardar los datos localmente.');return;}}
    isSaving=true; updateSyncLabel('Guardando…');
    saveQueue=saveQueue.catch(()=>{}).then(()=>api.save(sessionToken,snapshot)).then(()=>{saveLabel=IS_MYSQL_API?'Guardado en MySQL':'Sincronizado con Google Sheets';isSaving=false;updateSyncLabel(IS_MYSQL_API?'MySQL':'Google Sheets');return {ok:true};}).catch(err=>{isSaving=false;saveLabel='Error al sincronizar';updateSyncLabel('Error de conexión');showToast('No se pudo guardar: '+err.message);throw err;});
    try{return await saveQueue;}catch(e){return {ok:false,error:e};}
  }
  function updateSyncLabel(text){const el=$('.sync-pill'); if(el){el.innerHTML=`<span class="sync-dot"></span>${text}`;}}

  function modal(content){const wide=content.includes("modal-large");$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal ${wide?'modal-wide':''}">${content}</div></div>`;$('.modal-backdrop').addEventListener('click',e=>{if(e.target===$('.modal-backdrop'))closeModal();});}
  function closeModal(){$('#modal-root').innerHTML='';}

      case'close-round': return closeRound();
      case'reopen-round': return reopenRound();

  function newRoundModal(){
    if(activity().status==='Finalizada'){showToast('La sesión está finalizada. Crea una sesión nueva para agregar escrituras.');return;}
    const nextNumber=(activity().rounds||[]).length+1;
    modal(`<h2>Agregar escritura</h2><p>Agrega las escrituras antes de iniciar la actividad y ordénalas como se leerán. También puedes usar solo números si prefieres no mostrar la referencia en pantalla.</p><form id="new-round-form"><div class="field-wrap"><label for="round-display-mode">Cómo mostrar la escritura</label><select class="field" id="round-display-mode"><option value="reference">Mostrar referencia (ej. 1 Nefi 3:7)</option><option value="numbered">Mostrar solo “Escritura ${nextNumber}”</option></select></div><div class="field-wrap" id="reference-field"><label for="new-round-scripture">Referencia de la escritura</label><input class="field" id="new-round-scripture" placeholder="Ej. 1 Nefi 3:7" required></div><div class="field-wrap"><label for="new-round-type">Tipo de ronda</label><select class="field" id="new-round-type"><option value="normal">Normal · 200 o 100 puntos por tiempo</option><option value="especial">Especial · puntos configurables</option></select></div><div class="field-grid" id="normal-points-fields"><div class="field-wrap"><label for="early-points">Respuesta en primeros 5 segundos</label><input class="field" id="early-points" type="number" min="0" max="10000" value="200" required></div><div class="field-wrap"><label for="normal-points">Respuesta después de 5 segundos</label><input class="field" id="normal-points" type="number" min="0" max="10000" value="100" required></div></div><div class="field-wrap hidden" id="special-points-field"><label for="special-points">Puntos por barrio que la encuentre</label><input class="field" id="special-points" type="number" min="0" max="10000" value="500"></div><div class="field-grid"><div class="field-wrap"><label for="round-duration">Tiempo límite (segundos)</label><input class="field" id="round-duration" type="number" min="1" max="120" value="10" required></div><div class="field-wrap"><label for="fast-seconds">Límite de respuesta rápida</label><input class="field" id="fast-seconds" type="number" min="1" max="119" value="5" required></div></div><div class="notice">Sonará un aviso al llegar a los 5 segundos y otro al finalizar los 10 segundos. Puedes probar el sonido al iniciar el cronómetro.</div><div class="modal-actions"><button type="button" class="secondary" id="cancel-modal">Cancelar</button><button class="primary" type="submit">Guardar escritura</button></div></form>`);
    $('#cancel-modal').onclick=closeModal;
    $('#round-display-mode').onchange=()=>{const numbered=$('#round-display-mode').value==='numbered';$('#reference-field').classList.toggle('hidden',numbered);$('#new-round-scripture').required=!numbered;};
    $('#new-round-type').onchange=()=>{const special=$('#new-round-type').value==='especial';$('#normal-points-fields').classList.toggle('hidden',special);$('#special-points-field').classList.toggle('hidden',!special);$('#fast-seconds').disabled=special;};
    $('#new-round-form').onsubmit=e=>{e.preventDefault();const type=$('#new-round-type').value,duration=Math.max(1,Number($('#round-duration').value)||10),fast=Math.min(duration,Math.max(1,Number($('#fast-seconds').value)||5)),mode=$('#round-display-mode').value,number=(activity().rounds||[]).length+1;const scripture=mode==='numbered'?`Escritura ${number}`:$('#new-round-scripture').value.trim();if(!scripture)return;const r={id:id(),number,scripture,scriptureMode:mode,type,earlyPoints:Math.max(0,Number($('#early-points').value)||0),normalPoints:Math.max(0,Number($('#normal-points').value)||0),duration,fastSeconds:fast,specialPoints:Math.max(0,Number($('#special-points').value)||0),status:'lista',startedAt:null,results:{}};activity().rounds.push(r);selectedRoundId=r.id;page='live';closeModal();persist();showToast(`${scripture} agregada en la posición ${number}.`);};
  }
  function beep(kind='five'){
    try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;if(!audioContext)audioContext=new AudioCtx();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=kind==='end'?880:660;gain.gain.setValueAtTime(.0001,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.22,audioContext.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+(kind==='end'?.48:.24));osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+(kind==='end'?.5:.26));if(kind==='end'){setTimeout(()=>{try{const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.0001,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.18,audioContext.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioContext.currentTime+.35);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+.36);}catch(e){}},170);}}catch(e){/* El navegador puede bloquear audio hasta la primera interacción. */}
  }
  function startRound(){const a=activity(),r=activeRound(a);if(!r||a.status==='Finalizada')return;try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(AudioCtx&&!audioContext)audioContext=new AudioCtx();if(audioContext?.state==='suspended')audioContext.resume();}catch(e){}if(!a.rounds?.length)return;const previous=activeWards().some(w=>resultFor(r,w.id).found);if(previous){if(!confirm('Esta ronda ya tiene resultados. Reiniciar el cronómetro no borrará los puntos registrados. ¿Continuar?'))return;}r.startedAt=Date.now();if(!a.startedAt)a.startedAt=new Date().toISOString();r.status='activa';cueRoundId=r.id;cueFivePlayed=false;cueEndPlayed=false;persist();startVisualTimer();showToast('Cronómetro iniciado. Sonará al llegar a 5 segundos y al terminar.');}
  function closeRound(){const r=activeRound(activity());if(!r)return;r.status='cerrada';persist();showToast('Ronda cerrada. Si faltó registrar un barrio, usa Captura manual.');}
  function reopenRound(){const r=activeRound(activity());if(!r||activity().status==='Finalizada')return;r.status='lista';r.startedAt=null;persist();showToast('Ronda abierta de nuevo. Inicia el cronómetro para continuar.');}
  function markFound(wardId){const r=activeRound(activity());if(!r||!r.startedAt||r.status==='cerrada'||activity().status==='Finalizada')return;const elapsed=(Date.now()-Number(r.startedAt))/1000;if(elapsed>Number(r.duration||10)){r.status='cerrada';if(!cueEndPlayed){beep('end');cueEndPlayed=true;}persist();showToast('El tiempo terminó. Usa Captura manual si faltó algún barrio.');return;}if(resultFor(r,wardId).found){showToast('Este barrio ya tiene un resultado en esta ronda.');return;}if(!r.results)r.results={};const points=r.type==='especial'?Number(r.specialPoints)||0:(elapsed<=Number(r.fastSeconds||5)?Number(r.earlyPoints)||0:Number(r.normalPoints)||0);r.results[wardId]={found:true,points,seconds:Math.round(elapsed*10)/10,manual:false};persist();showToast(`${activeWards().find(w=>w.id===wardId)?.name||'Barrio'}: +${fmt(points)} puntos`);}
  function startVisualTimer(){if(timerInterval)clearInterval(timerInterval);if(page!=='live')return;const selected=activeRound(activity());if(!selected||!selected.startedAt||selected.status==='cerrada'){refreshTimerStatic();return;}if(cueRoundId!==selected.id){cueRoundId=selected.id;cueFivePlayed=false;cueEndPlayed=false;}timerInterval=setInterval(()=>{if(page!=='live'){clearInterval(timerInterval);return;}const r=activeRound(activity());if(!r||!r.startedAt||r.status==='cerrada'){clearInterval(timerInterval);refreshTimerStatic();return;}const elapsed=(Date.now()-Number(r.startedAt))/1000;const left=Math.max(0,Number(r.duration||10)-elapsed);const el=$('#timer-display'),status=$('#timer-status');if(el)el.innerHTML=`${left.toFixed(1)} <small>s</small>`;if(status)status.textContent=left<=0?'Tiempo terminado':`Tiempo restante · ${Number(r.duration||10)} segundos totales`;if(el){el.classList.toggle('timer-warning',left<=5&&left>0);el.classList.toggle('timer-ended',left<=0);}if(elapsed>=5&&!cueFivePlayed){beep('five');cueFivePlayed=true;}if(left<=0){if(!cueEndPlayed){beep('end');cueEndPlayed=true;}r.status='cerrada';clearInterval(timerInterval);persist();showToast('Se acabó el tiempo. Puedes completar o corregir puntos manualmente.');}},50);}
  function refreshTimerStatic(){const r=activeRound(activity());if(!r)return;const el=$('#timer-display'),status=$('#timer-status');const left=r.startedAt?Math.max(0,Number(r.duration||10)-(Date.now()-Number(r.startedAt))/1000):Number(r.duration||10);if(el){el.innerHTML=`${left.toFixed(1)} <small>s</small>`;el.classList.toggle('timer-warning',left<=5&&left>0);el.classList.toggle('timer-ended',left<=0);}if(status)status.textContent=r.status==='cerrada'?'Ronda cerrada':r.startedAt?'Cronómetro detenido':'Lista para iniciar';}
  function refreshTimerDisplay(){if(page==='live')startVisualTimer();}
  function manualScoreModal(){const a=activity(),r=activeRound(a);if(!r||!r.startedAt||a.status==='Finalizada'){showToast('La captura manual se habilita cuando una escritura ya se ha iniciado.');return;}const rows=activeWards().map((w,i)=>{const result=resultFor(r,w.id),defaultPoints=r.type==='especial'?Number(r.specialPoints)||0:Number(r.normalPoints)||100;return `<tr><td><strong>${esc(w.name)}</strong><div class="microcopy">Atajo ${i<9?i+1:'—'}</div></td><td><label class="check-item"><input type="checkbox" class="manual-found" data-ward="${esc(w.id)}" ${result.found?'checked':''}> Encontrada</label></td><td><input aria-label="Puntos de ${esc(w.name)}" class="field manual-points" data-ward="${esc(w.id)}" type="number" min="0" max="100000" value="${result.found?Number(result.points)||0:defaultPoints}" ${result.found?'':'disabled'}></td><td><input aria-label="Tiempo de ${esc(w.name)}" class="field manual-seconds" data-ward="${esc(w.id)}" type="number" min="0" max="120" step="0.1" placeholder="Manual" value="${result.seconds===null||result.seconds===undefined?'':Number(result.seconds)}" ${result.found?'':'disabled'}></td></tr>`;}).join('');
    modal(`<div class="modal-large"><h2>Captura manual de resultados</h2><p>Úsala cuando varios barrios encontraron la escritura y no alcanzaste a registrarlos durante los 10 segundos. Puedes marcar nuevos hallazgos, ajustar puntos o quitar un resultado por error.</p><div class="notice">Escritura actual: <strong>${esc(r.scripture)}</strong>. Los resultados manuales no necesitan un tiempo de respuesta.</div><form id="manual-results-form"><div class="table-wrap"><table class="data-table manual-table" style="min-width:580px"><thead><tr><th>Barrio</th><th>Hallazgo</th><th>Puntos</th><th>Tiempo (s)</th></tr></thead><tbody>${rows||'<tr><td colspan="4">No hay barrios activos.</td></tr>'}</tbody></table></div><div class="modal-actions"><button type="button" class="secondary" id="cancel-modal">Cancelar</button><button class="primary" type="submit">Guardar resultados</button></div></form></div>`);
    $('#cancel-modal').onclick=closeModal;document.querySelectorAll('.manual-found').forEach(ch=>ch.addEventListener('change',()=>{const w=ch.dataset.ward;const pts=$(`.manual-points[data-ward="${w}"]`),secs=$(`.manual-seconds[data-ward="${w}"]`);pts.disabled=!ch.checked;secs.disabled=!ch.checked;if(ch.checked&&!pts.value)pts.value=r.type==='especial'?r.specialPoints:r.normalPoints;}));
    $('#manual-results-form').onsubmit=e=>{e.preventDefault();if(!r.results)r.results={};for(const w of activeWards()){const check=$(`.manual-found[data-ward="${w.id}"]`);if(!check)continue;if(!check.checked){delete r.results[w.id];continue;}const pts=Math.max(0,Number($(`.manual-points[data-ward="${w.id}"]`).value)||0),rawSeconds=$(`.manual-seconds[data-ward="${w.id}"]`).value.trim(),seconds=rawSeconds===''?null:Math.max(0,Number(rawSeconds));r.results[w.id]={found:true,points:pts,seconds:Number.isFinite(seconds)?seconds:null,manual:rawSeconds==='',updatedAt:new Date().toISOString()};}if(r.status!=='activa')r.status='cerrada';closeModal();persist();showToast('Los resultados manuales se guardaron.');};
  }
  function moveRound(roundId,delta){const a=activity(),idx=a.rounds.findIndex(r=>r.id===roundId),next=idx+delta;if(idx<0||next<0||next>=a.rounds.length)return;[a.rounds[idx],a.rounds[next]]=[a.rounds[next],a.rounds[idx]];a.rounds.forEach((r,i)=>{r.number=i+1;if(r.scriptureMode==='numbered')r.scripture=`Escritura ${i+1}`;});selectedRoundId=roundId;persist();showToast('Orden de escrituras actualizado.');}
  function deleteActivity(actId){const target=appState.activities.find(a=>a.id===actId);if(!target)return;if(!confirm(`¿Eliminar la sesión “${target.name}” con sus ${target.rounds?.length||0} escrituras, asistencia y puntuaciones? Esta acción no se puede deshacer.`))return;appState.activities=appState.activities.filter(a=>a.id!==actId);if(!appState.activities.length){const a={id:id(),name:'Nueva sesión de Pesquisas',date:today(),status:'En curso',createdAt:new Date().toISOString(),startedAt:new Date().toISOString(),attendance:{},rounds:[]};activeWards().forEach(w=>a.attendance[w.id]={attendees:0,bishop:false,seminary:false,ym:false,yw:false});appState.activities.push(a);}if(!appState.activities.some(a=>a.id===appState.activeActivityId))appState.activeActivityId=appState.activities[0].id;selectedRoundId=null;page='history';persist();showToast('Sesión eliminada.');}
  function finishActivity(){const a=activity();if(!a)return;if(a.status==='Finalizada'){showPodiumAgain();return;}if(!(a.rounds||[]).length){if(!confirm('Esta sesión no tiene escrituras configuradas. ¿Quieres finalizarla de todos modos?'))return;}else if(!confirm(`¿Terminar la sesión “${a.name}”? Se cerrarán las rondas y comenzará una animación de cierre de 20 segundos antes de revelar el podio.`))return;a.status='Finalizada';a.endedAt=new Date().toISOString();if(!a.startedAt)a.startedAt=a.createdAt||a.endedAt;a.rounds.forEach(r=>{if(r.status==='activa')r.status='cerrada';});persist().then(()=>startCeremony(a.id));}
  function startCeremony(actId){const a=appState.activities.find(x=>x.id===actId);if(!a)return;ceremonySnapshot={id:a.id,name:a.name,date:a.date,rank:totals(a).map((x,i)=>({position:i+1,name:x.ward.name,score:x.score,found:x.found,attendance:x.attendance}))};ceremonyStartedAt=Date.now();ceremonyStep=0;if(ceremonyTimer)clearInterval(ceremonyTimer);renderCeremonyLoading();ceremonyTimer=setInterval(()=>{const elapsed=Date.now()-ceremonyStartedAt,remaining=Math.max(0,20000-elapsed),progress=Math.min(100,elapsed/20000*100),bar=$('#ceremony-progress-fill'),time=$('#ceremony-time'),status=$('#ceremony-status');if(bar)bar.style.width=`${progress}%`;if(time)time.textContent=`${Math.ceil(remaining/1000)} segundos`;if(status){const messages=['Guardando los resultados finales…','Contando las escrituras encontradas…','Sumando puntos y bonificaciones…','Preparando la ceremonia de premiación…'];status.textContent=messages[Math.min(messages.length-1,Math.floor(elapsed/5000))];}if(remaining<=0){clearInterval(ceremonyTimer);ceremonyTimer=null;renderPodiumStep(0);}},100);}
  function confettiMarkup(){return `<div class="ceremony-confetti">${Array.from({length:42},(_,i)=>`<span class="confetti-piece" style="left:${(i*37)%100}%;animation-delay:${(i%11)*-.37}s;animation-duration:${3.5+(i%7)*.31}s;background:${['#ffc77d','#a9a0ff','#72ead1','#ff89a5','#f4e7a0'][i%5]}"></span>`).join('')}</div>`;}
  function renderCeremonyLoading(){const layer=$('#modal-root');layer.innerHTML=`<div class="ceremony-overlay"><section class="ceremony-panel"><div class="ceremony-kicker">Pesquisas de Estaca · Cierre de sesión</div><div class="ceremony-orbit"><div class="ceremony-symbol">✦</div></div><h1 class="ceremony-title">Preparando los resultados</h1><p class="ceremony-copy">Estamos revisando los puntos, las escrituras encontradas y la asistencia. En unos segundos comenzará la premiación.</p><div class="ceremony-dots"><span></span><span></span><span></span></div><div class="ceremony-progress"><div class="ceremony-progress-fill" id="ceremony-progress-fill"></div></div><div class="ceremony-time" id="ceremony-time">20 segundos</div><p class="microcopy" style="color:#b8b9dd;margin-top:15px" id="ceremony-status">Guardando los resultados finales…</p></section></div>`;}
  function renderPodiumStep(step){ceremonyStep=step;const a=ceremonySnapshot;if(!a)return;const positions=[3,2,1],position=positions[step];const winner=a.rank.find(x=>x.position===position);const klass=position===3?'bronze':position===2?'silver':'champion';const medals={1:'🏆',2:'🥈',3:'🥉'};const title=position===1?'Primer lugar':position===2?'Segundo lugar':'Tercer lugar';const btn=step<2?`<button class="primary podium-next" id="podium-next">Revelar ${positions[step+1]===2?'segundo':'primer'} lugar →</button>`:`<button class="primary podium-next" id="podium-next">Ver clasificación completa →</button>`;$('#modal-root').innerHTML=`<div class="ceremony-overlay">${confettiMarkup()}<section class="ceremony-panel"><div class="ceremony-kicker">${esc(a.name)} · Premiación</div><div class="podium-medal ${klass}">${medals[position]}</div><div class="podium-place">${title}</div><h1 class="podium-name">${winner?esc(winner.name):'Sin participante'}</h1><div class="podium-points">${winner?`${fmt(winner.score)} puntos · ${winner.found} escrituras encontradas`:'No hay suficientes barrios con resultados para ocupar este lugar.'}</div>${btn}</section></div>`;$('#podium-next').onclick=()=>{if(step<2)renderPodiumStep(step+1);else renderCeremonyFinal();};}
  function renderCeremonyFinal(){const a=ceremonySnapshot;if(!a)return;$('#modal-root').innerHTML=`<div class="ceremony-overlay">${confettiMarkup()}<section class="ceremony-panel"><div class="ceremony-kicker">Sesión finalizada</div><h1 class="ceremony-title">¡Gracias por participar!</h1><p class="ceremony-copy">${esc(a.name)} · ${a.rank.length} barrios clasificados. Estos resultados quedan guardados en la base de datos.</p><div class="final-rank">${a.rank.map(x=>`<div class="final-rank-row"><div class="final-rank-no">${x.position}</div><div><div class="final-rank-name">${esc(x.name)}</div><div class="microcopy" style="color:#bcbfe0">${x.found} escrituras · ${x.attendance} asistentes</div></div><div class="final-rank-points">${fmt(x.score)} pts</div></div>`).join('')}</div><button class="primary podium-next" id="ceremony-home">Volver a la pantalla principal</button></section></div>`;$('#ceremony-home').onclick=()=>{closeModal();page='dashboard';render();};}
  function showPodiumAgain(){const a=activity();if(!a)return;if(ceremonyTimer){clearInterval(ceremonyTimer);ceremonyTimer=null;}ceremonySnapshot={id:a.id,name:a.name,date:a.date,rank:totals(a).map((x,i)=>({position:i+1,name:x.ward.name,score:x.score,found:x.found,attendance:x.attendance}))};renderPodiumStep(0);}
  function wardModal(ward=null){modal(`<h2>${ward?'Editar barrio':'Agregar barrio'}</h2><p>Usa el nombre habitual del barrio para facilitar los registros entre actividades.</p><form id="ward-form"><div class="field-wrap"><label for="ward-name">Nombre del barrio</label><input class="field" id="ward-name" value="${esc(ward?.name||'')}" placeholder="Ej. Barrio Centro" required maxlength="80"></div><div class="modal-actions"><button type="button" class="secondary" id="cancel-modal">Cancelar</button><button class="primary" type="submit">${ward?'Guardar cambios':'Agregar barrio'}</button></div></form>`);$('#cancel-modal').onclick=closeModal;$('#ward-form').onsubmit=e=>{e.preventDefault();const name=$('#ward-name').value.trim();if(!name)return;if(ward){ward.name=name;}else{const w={id:id(),name,active:true};appState.wards.push(w);appState.activities.forEach(a=>{getAttendance(a,w.id);});}closeModal();persist();showToast(ward?'Barrio actualizado.':'Barrio agregado.');};}
  function wardManagerModal(){modal(`<div class="modal-large"><h2>Gestionar barrios</h2><p>Renombra los barrios o desactiva los que ya no participan. Desactivar conserva sus resultados históricos.</p><div class="table-wrap"><table class="data-table" style="min-width:0"><thead><tr><th>Nombre</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${appState.wards.map(w=>`<tr><td><strong>${esc(w.name)}</strong></td><td><span class="badge ${w.active!==false?'green':'red'}">${w.active!==false?'Activo':'Inactivo'}</span></td><td><button class="secondary" style="padding:6px 8px;font-size:10px" data-edit-ward="${esc(w.id)}">Editar</button> <button class="secondary" style="padding:6px 8px;font-size:10px" data-toggle-ward="${esc(w.id)}">${w.active!==false?'Desactivar':'Activar'}</button></td></tr>`).join('')}</tbody></table></div><div class="modal-actions"><button type="button" class="secondary" id="cancel-modal">Cerrar</button><button type="button" class="primary" id="new-ward-modal">＋ Agregar barrio</button></div></div>`);$('#cancel-modal').onclick=closeModal;$('#new-ward-modal').onclick=()=>wardModal();document.querySelectorAll('[data-edit-ward]').forEach(btn=>btn.onclick=()=>{const w=appState.wards.find(x=>x.id===btn.dataset.editWard);wardModal(w);});document.querySelectorAll('[data-toggle-ward]').forEach(btn=>btn.onclick=()=>{const w=appState.wards.find(x=>x.id===btn.dataset.toggleWard);if(w){w.active=w.active===false;closeModal();persist();showToast(w.active?'Barrio activado.':'Barrio desactivado.');}});}
  function exportJson(){const blob=new Blob([JSON.stringify(appState,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`pesquisas-respaldo-${today()}.json`;a.click();URL.revokeObjectURL(url);showToast('Copia de respaldo descargada.');}
  async function logout(){try{await api.logout(sessionToken);}catch(e){}sessionToken=null;appState=null;selectedRoundId=null;if(timerInterval)clearInterval(timerInterval);page='dashboard';render();}

  // Install event delegation for the small number of action buttons rendered later.
  document.addEventListener('click', e=>{const el=e.target.closest('[data-action]');if(!el)return;if(el.dataset.action==='select-round')return; if(!el.closest('#page-content'))return; const actionsHandled=new Set(['new-activity','new-round','start-round','close-round','reopen-round','mark-found','new-ward','manage-wards','open-activity','export-json','logout','finish-activity','show-podium','manual-score','delete-activity','move-round-up','move-round-down']); if(actionsHandled.has(el.dataset.action)){ e.preventDefault();handleAction(el.dataset.action,el); }});

  document.addEventListener('keydown',e=>{const card=e.target.closest?.('.score-team-clickable');if(card&&e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();markFound(card.dataset.ward);return;}if(page!=='live'||e.ctrlKey||e.altKey||e.metaKey||e.target.closest('input,textarea,select,[contenteditable="true"]'))return;if(!/^[1-9]$/.test(e.key))return;const a=activity(),r=activeRound(a);if(!r||a.status==='Finalizada'||r.status!=='activa')return;const w=activeWards()[Number(e.key)-1];if(w){e.preventDefault();markFound(w.id);}});

  // Keep the local prototype immediately usable, with editable sample ward names.
  renderLogin();
})();
